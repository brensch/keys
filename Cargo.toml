[package]
name = "nocaps"
version = "1.4.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0"
directories = "6.0"
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
thread-priority = "3.1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
gtk = "0.18"
libloading = "0.8"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.48"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
ctrlc = { version = "3.4", features = ["termination"] }
enigo = { version = "0.6", default-features = false }
winit = { version = "0.30", default-features = false }

[build-dependencies]
embed-resource = "1.5"
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

# Whole-program optimization lets the hook paths inline across crate boundaries.
# Panics keep unwinding so the macOS Caps Lock mapping is still restored on a crash.
[profile.release]
lto = "fat"
codegen-units = 1
